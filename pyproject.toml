[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabds"
dynamic = ["version"]
description = "Fable/DeepSeek orchestration controller for Codex skills. Standard library only."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fabds = "fabds.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "live: requires real provider credentials and spends money (deselected by default)",
]
